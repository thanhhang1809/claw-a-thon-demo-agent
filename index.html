<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Story Writer</title>
    <style>
        :root {
            --ink: #1f2328;
            --muted: #667085;
            --paper: #fffaf0;
            --panel: #ffffff;
            --line: #d9c7a5;
            --accent: #8f3f2b;
            --accent-dark: #642b1e;
            --forest: #274c3a;
            --gold: #b8862f;
            --bg: #f4efe4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--ink);
            font-family: ui-serif, Georgia, "Times New Roman", serif;
            background:
                linear-gradient(rgba(42, 32, 21, 0.58), rgba(42, 32, 21, 0.4)),
                url("https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=1800&q=80");
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .app {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        header {
            color: white;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(34px, 5vw, 64px);
            line-height: 1;
            margin: 0 0 10px;
            letter-spacing: 0;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
        }

        header p {
            width: min(720px, 100%);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.88);
        }

        .workspace {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: rgba(255, 250, 240, 0.96);
            border: 1px solid rgba(217, 199, 165, 0.9);
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(28, 20, 12, 0.28);
        }

        .controls {
            padding: 20px;
            position: sticky;
            top: 24px;
        }

        .story-panel {
            min-height: 650px;
            overflow: hidden;
        }

        .story-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.42);
        }

        .story-toolbar strong {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .story {
            padding: 32px clamp(22px, 5vw, 56px) 44px;
        }

        .story h2 {
            margin: 0 0 18px;
            color: var(--accent-dark);
            font-size: clamp(28px, 4vw, 48px);
            line-height: 1.08;
            letter-spacing: 0;
        }

        .story-text {
            white-space: pre-line;
            font-size: 20px;
            line-height: 1.82;
        }

        .empty-state {
            min-height: 520px;
            display: grid;
            place-items: center;
            padding: 42px;
            text-align: center;
            color: var(--muted);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .empty-state div {
            max-width: 440px;
        }

        .empty-state h2 {
            margin: 0 0 10px;
            color: var(--accent-dark);
            font-family: ui-serif, Georgia, "Times New Roman", serif;
            font-size: 34px;
            letter-spacing: 0;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: var(--accent-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            font-weight: 700;
        }

        textarea,
        input,
        select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 11px 12px;
            color: var(--ink);
            background: white;
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        textarea:focus,
        input:focus,
        select:focus {
            outline: 2px solid rgba(184, 134, 47, 0.24);
            border-color: var(--gold);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            border: 0;
            border-radius: 6px;
            min-height: 46px;
            padding: 0 16px;
            font: 700 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: pointer;
        }

        .primary {
            width: 100%;
            margin-top: 18px;
            color: white;
            background: var(--accent);
        }

        .primary:hover { background: var(--accent-dark); }
        .primary:disabled { opacity: 0.65; cursor: wait; }

        .secondary {
            color: var(--accent-dark);
            background: transparent;
            border: 1px solid var(--line);
        }

        .secondary:hover { background: rgba(217, 199, 165, 0.25); }

        .status {
            margin-top: 12px;
            min-height: 20px;
            color: var(--muted);
            font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.55);
            color: var(--muted);
            font-size: 13px;
        }

        .outline {
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .outline h3 {
            margin: 0 0 12px;
            color: var(--forest);
            font-size: 16px;
        }

        .outline ol {
            margin: 0;
            padding-left: 22px;
            color: var(--muted);
            line-height: 1.65;
        }

        @media (max-width: 860px) {
            body { background-attachment: scroll; }
            .app { width: min(100% - 24px, 620px); padding: 22px 0; }
            .workspace { grid-template-columns: 1fr; }
            .controls { position: static; }
            .story-panel { min-height: 520px; }
            .story-toolbar { align-items: stretch; flex-direction: column; }
            .secondary { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <h1>Medieval Story Writer</h1>
            <p>Nhập một ý tưởng ngắn, chọn giọng kể và để agent dựng thành truyện thời trung cổ dễ đọc ngay trên trình duyệt.</p>
        </header>

        <section class="workspace">
            <form class="panel controls" id="storyForm">
                <label for="topic">Chủ đề truyện</label>
                <textarea id="topic" name="topic" placeholder="Ví dụ: một công chúa giả trai làm hiệp sĩ để tìm vương miện bị đánh cắp">mot hiep si di tim vuong mien that lac</textarea>

                <div class="field-row">
                    <div>
                        <label for="tone">Giọng kể</label>
                        <select id="tone" name="tone">
                            <option value="epic">Epic</option>
                            <option value="dark">Dark</option>
                            <option value="romantic">Romantic</option>
                            <option value="humorous">Humorous</option>
                        </select>
                    </div>
                    <div>
                        <label for="length">Độ dài</label>
                        <select id="length" name="length">
                            <option value="short">Short</option>
                            <option value="medium" selected>Medium</option>
                            <option value="long">Long</option>
                        </select>
                    </div>
                </div>

                <label for="protagonist">Nhân vật chính</label>
                <input id="protagonist" name="protagonist" placeholder="Để trống nếu muốn agent tự chọn">

                <label for="setting">Bối cảnh</label>
                <input id="setting" name="setting" placeholder="Ví dụ: vương quốc đá trắng bên bờ biển mùa đông">

                <label for="language">Ngôn ngữ</label>
                <select id="language" name="language">
                    <option value="vi" selected>Tiếng Việt</option>
                    <option value="en">English</option>
                </select>

                <button class="primary" id="generateBtn" type="submit">Tạo truyện</button>
                <div class="status" id="status"></div>
            </form>

            <article class="panel story-panel">
                <div class="story-toolbar">
                    <strong id="modeLabel">Local medieval fantasy agent</strong>
                    <button class="secondary" id="copyBtn" type="button">Copy truyện</button>
                </div>
                <div id="storyOutput" class="empty-state">
                    <div>
                        <h2>Sẵn sàng viết truyện</h2>
                        <p>Điền chủ đề rồi nhấn tạo truyện. Kết quả sẽ hiện ở đây với tiêu đề, nội dung và outline.</p>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script>
        const form = document.getElementById("storyForm");
        const button = document.getElementById("generateBtn");
        const statusBox = document.getElementById("status");
        const output = document.getElementById("storyOutput");
        const modeLabel = document.getElementById("modeLabel");
        const copyBtn = document.getElementById("copyBtn");
        let latestStoryText = "";

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(form).entries());
            payload.topic = payload.topic.trim();

            if (!payload.topic) {
                statusBox.textContent = "Bạn cần nhập chủ đề truyện.";
                return;
            }

            setLoading(true);
            try {
                const response = await fetch("/invocations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();
                if (!response.ok || data.status !== "success") {
                    throw new Error(data.message || "Không tạo được truyện.");
                }

                renderStory(data.result, data.llm);
                statusBox.textContent = "Đã tạo truyện.";
            } catch (error) {
                statusBox.textContent = error.message || "Có lỗi xảy ra.";
            } finally {
                setLoading(false);
            }
        });

        copyBtn.addEventListener("click", async () => {
            if (!latestStoryText) {
                statusBox.textContent = "Chưa có truyện để copy.";
                return;
            }
            await navigator.clipboard.writeText(latestStoryText);
            statusBox.textContent = "Đã copy truyện.";
        });

        function setLoading(isLoading) {
            button.disabled = isLoading;
            button.textContent = isLoading ? "Đang viết..." : "Tạo truyện";
            statusBox.textContent = isLoading ? "Agent đang dựng cốt truyện và lời kể." : "";
        }

        function renderStory(result, llm) {
            const title = result.title || "Truyện Trung Cổ";
            const story = result.story || "";
            const outline = Array.isArray(result.outline) ? result.outline : [];
            const metadata = result.metadata || {};
            latestStoryText = `${title}\n\n${story}`;
            modeLabel.textContent = llm && llm.enabled ? `LLM: ${llm.model || "enabled"}` : "Local medieval fantasy agent";

            output.className = "story";
            output.innerHTML = `
                <div class="meta">
                    <span class="chip">${escapeHtml(metadata.genre || "medieval fantasy")}</span>
                    <span class="chip">${escapeHtml(metadata.tone || "epic")}</span>
                    <span class="chip">${escapeHtml(metadata.length || "medium")}</span>
                    <span class="chip">${escapeHtml(metadata.language || "vi")}</span>
                </div>
                <h2>${escapeHtml(title)}</h2>
                <div class="story-text">${escapeHtml(story)}</div>
                ${outline.length ? renderOutline(outline) : ""}
            `;
        }

        function renderOutline(items) {
            return `
                <div class="outline">
                    <h3>Outline</h3>
                    <ol>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ol>
                </div>
            `;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
